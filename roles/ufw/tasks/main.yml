---
- name: Install ufw packages
  apt:
    name: ufw

- name: Deny everything and enable UFW
  ufw:
    state: enabled
    policy: deny

- name: Set logging
  ufw:
    logging: 'on'

# see - http://unixluser.org/techmemo/ident/
- name: mail/ftp が遅くならないように 113 port は reject にしとくと良いっぽい 
  ufw:
    rule: reject
    port: auth
    log: yes

# ufw supports connection rate limiting, which is useful for protecting
# against brute-force login attacks. ufw will deny connections if an IP
# address has attempted to initiate 6 or more connections in the last
# 30 seconds. See  http://www.debian-administration.org/articles/187
# for details. Typical usage is:
# limit は30秒間に6回アクセスしてきた IP の接続を一定時間拒否する
# 22番は LAN 内からのみ許可する。削除より先に追加し、実行中の接続を切らないようにする
- name: Allow ssh from RFC1918(IPv4) networks
  ufw:
    rule: limit
    from_ip: '{{ local_network_ipv4 }}'
    port: ssh
    proto: tcp

- name: Allow ssh from RFC4193(IPv6) networks
  ufw:
    rule: limit
    from_ip: '{{ local_network_ipv6 }}'
    port: ssh
    proto: tcp

# 以前の playbook が作った「どこからでも 22番を許可」するルールを消す
- name: Remove ssh rule open to anywhere
  ufw:
    rule: limit
    port: ssh
    proto: tcp
    delete: yes

- name: Remove OpenSSH app rule open to anywhere
  ufw:
    rule: limit
    name: OpenSSH
    delete: yes

# ssh_port_custom に 22 を入力して実行したときに作られたルール
- name: Remove port 22 rule allowed from anywhere
  ufw:
    rule: allow
    port: '22'
    delete: yes

# 22番を入力すると全世界に開いてしまうため、22番以外のときだけ許可する
- name: Allow OpenSSH-custom
  ufw:
    rule: limit
    port: '{{ ssh_port_custom }}'
    proto: tcp
  when: ssh_port_custom | int != 22

# 以前の playbook が作った TCP/UDP 両方を無制限に許可するルールを消す
- name: Remove OpenSSH-custom rule without proto and limit
  ufw:
    rule: allow
    port: '{{ ssh_port_custom }}'
    delete: yes
  when: ssh_port_custom | int != 22

# ---
# Settings of apps or services.
# App setting files are /etc/ufw/applications.d/.

- name: Allow all access from RFC1918(IPv4) networks to this host
  ufw:
    rule: allow
    from_ip: '{{ local_network_ipv4 }}'
    name: Samba

- name: Allow all access from RFC4193(IPv6) networks to this host
  ufw:
    rule: allow
    from_ip: '{{ local_network_ipv6 }}'
    name: Samba

- name: Allow HTTP/HTTPS
  ufw:
    rule: allow
    port: 80,443
    proto: tcp

- name: Configure UFW
  template:
    src: etc/default/ufw.j2
    dest: /etc/default/ufw
    owner: root
    group: root
    mode: 0644
    backup: yes

